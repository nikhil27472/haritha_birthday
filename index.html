<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="Birthday Countdown">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Birthday Countdown</title>
    <link rel="stylesheet" href="count.css?v=2">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Cosmic Background Elements -->
    <div class="nebula"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="twinkle">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>
    
    <!-- Main Content -->
    <div class="container">
        <h1 id="headline">🎂<br>✨ Countdown to very Special Day! ✨<br>A Suprise awaits...</h1>
        <div id="countdown">
            <ul>
                <li><span id="days"></span>days</li>
                <li><span id="hours"></span>Hours</li>
                <li><span id="minutes"></span>Minutes</li>
                <li><span id="seconds"></span>Seconds</li>
            </ul>
        </div>
        <div id="content" class="emoji">
            <span>🎉</span>
            <span>🎂</span>
            <span>🎈</span>
        </div>
    </div>

    <script>
        // Audio context activation for autoplay permissions
        let audioContextActivated = false;
        
        function activateAudioContext() {
            if (!audioContextActivated) {
                // Create a silent audio context to activate audio permissions
                const silentAudio = new Audio();
                silentAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                silentAudio.play().catch(() => {});
                audioContextActivated = true;
                sessionStorage.setItem('audioActivated', 'true');
                console.log('Audio context activated');
            }
        }
        
        // Activate audio on any user interaction
        document.addEventListener('click', activateAudioContext, { once: true });
        document.addEventListener('touchstart', activateAudioContext, { once: true });
        document.addEventListener('keydown', activateAudioContext, { once: true });
        
        // Set session flag when index page loads
        sessionStorage.setItem('visitedIndex', 'true');
        sessionStorage.removeItem('visitedBirthday'); // Clear birthday flag for fresh start
        
        (function () {
            const second = 1000,
                minute = second * 60,
                hour = minute * 60,
                day = hour * 24;
            
            let today = new Date(),
                dd = String(today.getDate()).padStart(2, "0"),
                mm = String(today.getMonth() + 1).padStart(2, "0"),
                yyyy = today.getFullYear(),
                nextYear = yyyy + 1,
                dayMonth = "06/09/",
                //dayMonth = dd+"/"+mm+"/",
                birthday = dayMonth + yyyy;
            
            today = mm + "/" + dd + "/" + yyyy;
            if (today > birthday) {
                birthday = dayMonth + nextYear;
            }
            
            const countDown = new Date(birthday).getTime(),
                x = setInterval(function() {
                    const now = new Date().getTime(),
                        distance = countDown - now;
                    
                    document.getElementById("days").innerText = Math.floor(distance / (day));
                    document.getElementById("hours").innerText = Math.floor((distance % (day)) / (hour));
                    document.getElementById("minutes").innerText = Math.floor((distance % (hour)) / (minute));
                    document.getElementById("seconds").innerText = Math.floor((distance % (minute)) / second);
                    
                    // When countdown reaches zero
                    if (distance < 0) {
                        document.getElementById("headline").innerText = "🎉 It's Birthday Time! 🎉";
                        document.getElementById("countdown").style.display = "none";
                        document.getElementById("content").style.display = "block";
                        clearInterval(x);
                        
                        // Ensure audio is activated before redirecting
                        activateAudioContext();
                        
                        // Redirect to birthday page after 2 seconds
                        setTimeout(function() {
                            window.location.href = "birthday.html";
                        }, 2000);
                    }
                }, 1000);
        }());
    </script>
</body>
</html>
