<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Love Letter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="love.css?v=2">
</head>
<body>

    <script>
        // Check if user came from birthday page
        if (!sessionStorage.getItem('visitedBirthday')) {
            // Redirect to index if accessed directly
            window.location.href = 'index.html';
        }
    </script>
    <div class="letter-image">
        <div class="animated-mail">
            <div class="back-fold"></div>
            <div class="letter">
                <div class="letter-border"></div>
                <div class="letter-title"></div>
                <div class="letter-context"></div>
                <div class="letter-stamp">
                    <div class="letter-stamp-inner"></div>
                </div>
            </div>
            <div class="top-fold"></div>
            <div class="body"></div>
            <div class="left-fold"></div>
        </div>
        <div class="shadow"></div>
    </div>

    <!-- Overlay for the Love Letter -->
    <div id="love-message-overlay">
        <!-- Background Music -->
        <audio id="bg-music" src="18pages.mp3" preload="auto" loop></audio>
        
        <div class="love-message-content">
            <div class="spiral-binding">
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
                <div class="spiral-ring"></div>
            </div>
            <div class="letter-content">
                <h1 id="typewriter-h1" data-text="Hello Bujjamma🌟​"></h1>
                
                <p id="typewriter-p2" data-text="This is my first time writing🫣, im not sure how to start or where to start 🤔​..... Lets start from the begining....
Nijam cheppali ante...
ninnu modhati sari chusinappudu ....
em Special ga anipinchaledhu...
Kani... enduko teliyadu...
ninnu malli malli chudali anipinchindhi...
Nuvvu simple ga 'chepandi' annapudu kuda,
naku adhi chinna matter kaadhu...
aa roju motham gurthosthindhi..
Nuvvu chinna chinna vishayalu share chesinappudu,
nenu vinadam lo busy ayipoya...
endhuko... nee voice kuda calm ga anipinchindhi...
Nenu love lo padtha ani anukoledhu...
but I fell for your smile... your cuteness... for you...
okka maatalo cheppaali antae...
ఈ 3 నెలల్లో, నీతో మాట్లాడినా ప్రతీ రోజూ... ప్రతి నిమిషం... ప్రతీ క్షణం ... నీ మీద ప్రేమ పెరుగుతూనే ఉంది🫶​. ప్రతి రోజు మనం మాట్లాడుకున్నప్పుడు, నీ ఆలోచనలు, నువ్వు చూపిన ప్రేమ, నాకు ఎంతో నచ్చాయి ☺️.
Last ga...
Future లో నీకు ఎంత సంపాదించి పెడతానో చెప్పలేను గానీ నిన్ను సంతోషపెట్టడానికి ప్రతీ రోజూ, ప్రతి నిమిషం, ప్రతీ క్షణం ప్రయత్నిస్తూనే ఉంటాను.
"></p>
                <h3 id="typewriter-h3" data-text="I ❤️ You Forever ra! ✨"></h3>
                <div class="signature" id="typewriter-signature" data-text="ఇట్లు, 
                నీ Fiance 🫂​">❤️</div>
            </div>
        </div>
        <!-- Floating Hearts -->
        <div class="heart heart1"></div>
        <div class="heart heart2"></div>
        <div class="heart heart3"></div>
        <div class="heart heart4"></div>
        <div class="heart heart5"></div>
        <div class="heart heart6"></div>
        <div class="heart heart7"></div>
        <div class="heart heart8"></div>
    </div>

    <script src="love.js"></script>
</body>
</html>
